services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_ai}
      POSTGRES_USER: ${POSTGRES_USER:-personal_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - personal_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: ${APP_ENV:-deployment-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-personal_ai}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-personal_ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-only-secret-at-least-32-chars}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_ENV: ${APP_ENV:-deployment-local}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-personal_ai}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-personal_ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-2-latest}
      MODEL_PROVIDER_DEFAULT: ${MODEL_PROVIDER_DEFAULT:-openai}
      MODEL_COLLABORATION_ENABLED: ${MODEL_COLLABORATION_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-only-secret-at-least-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  personal_ai_postgres_data:
